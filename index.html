<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cámara QR - EST 215</title>

  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://unpkg.com/@zxing/library@latest"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      text-align: center;
    }

    .contenedor {
      max-width: 600px;
      margin: 20px auto;
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,.15);
    }

    h1 {
      margin-bottom: 5px;
    }

    #reader {
      width: 100%;
      margin-top: 25px;
      object-fit: contain;
    }

    #resultado {
      margin-top: 20px;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h1>Terminal de Asistencia</h1>

    <p>Escuela Secundaria Técnica No. 215</p>

    <h2>Escáner con cámara</h2>

    <video id="reader" autoplay muted playsinline></video>

    <div id="resultado">
      Esperando lectura de credencial...
    </div>

  </div>

  <script>

    function qrLeido(textoQR) {

      document.getElementById("resultado").innerHTML =
        "✓ QR detectado<br><br>" + textoQR;

    }

    const lectorZXing = new ZXing.BrowserQRCodeReader();

document.getElementById("resultado").innerHTML =
  "Iniciando cámara...";

lectorZXing
  .decodeFromConstraints(
    {
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    },
    "reader",
    function(resultado, error) {

      if (resultado) {

        const textoQR = resultado.getText();

        document.getElementById("resultado").innerHTML =
          "✓ QR detectado<br><br>" + textoQR;

        qrLeido(textoQR);
      }

      if (
        error &&
        !(error instanceof ZXing.NotFoundException)
      ) {
        console.log(error);
      }
    }
  )
  .catch(function(error) {

    document.getElementById("resultado").innerHTML =
      "No fue posible iniciar la cámara.<br><br>" +
      error;

  });
  </script>

</body>
</html>
