<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cámara QR - EST 215</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      text-align: center;
    }

    .contenedor {
      max-width: 600px;
      margin: 20px auto;
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,.15);
    }

    h1 {
      margin-bottom: 5px;
    }

    #reader {
      width: 100%;
      margin-top: 25px;
    }

    #resultado {
      margin-top: 20px;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h1>Terminal de Asistencia</h1>

    <p>Escuela Secundaria Técnica No. 215</p>

    <h2>Escáner con cámara</h2>

    <div id="reader"></div>

    <div id="resultado">
      Esperando lectura de credencial...
    </div>

  </div>

  <script>

    function qrLeido(textoQR) {

      document.getElementById("resultado").innerHTML =
        "✓ QR detectado<br><br>" + textoQR;

    }

    const lectorQR = new Html5Qrcode("reader");

const configuracion = {
  fps: 15,
  qrbox: function(viewfinderWidth, viewfinderHeight) {
    const ancho = Math.floor(viewfinderWidth * 0.50);
    const alto = Math.floor(viewfinderHeight * 0.50);

    return {
      width: ancho,
      height: alto
    };
  },
  aspectRatio: 1.777778
};

const camara = {
  facingMode: "environment"
};

lectorQR.start(
  camara,
  configuracion,
  function(textoQR) {
    qrLeido(textoQR);
  },
  function(errorLectura) {
    // Mientras no encuentre un QR continúa escaneando.
  }
).then(function() {

  setTimeout(function() {

    const video = document.querySelector("#reader video");

    if (video) {
      document.getElementById("resultado").innerHTML =
        "Esperando lectura de credencial...<br><br>" +
        "<span style='font-size:16px;font-weight:normal;'>" +
        "Resolución real: " +
        video.videoWidth + " × " + video.videoHeight +
        "</span>";
    }

  }, 1500);

}).catch(function(error) {

  document.getElementById("resultado").innerHTML =
    "No fue posible iniciar la cámara.<br><br>" +
    error;

});

  </script>

</body>
</html>
